<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monga Cal — Executive Workload Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=4">
</head>
<body>

  <div class="tablet-frame">
    <div class="wood-trim"></div>
    <div class="tablet-content">

      <!-- Top Executive Header -->
      <header class="executive-header">
        <div>
          <h1 class="brand-title">Monga Cal</h1>
        </div>
        
        <div class="live-clock-widget">
          <div class="clock-time" id="clockTime">--:--</div>
          <div class="clock-date" id="clockDate">--</div>
        </div>

        <div class="header-right-actions">
          <button class="icon-pill-btn" id="openSettingsBtn" title="Schedule Settings">⚙️</button>
          <button class="icon-pill-btn" id="rescheduleBtn" title="Reschedule Plan">⚡</button>
        </div>
      </header>

      <!-- Navigation Tabs -->
      <nav class="nav-tabs-bar">
        <button class="nav-tab-btn active" id="tabScheduleBtn">
          <span>📅</span> Schedule
        </button>
        <button class="nav-tab-btn" id="tabHistoryBtn">
          <span>⏱️</span> Completed & Time Log
        </button>
      </nav>

      <!-- TAB 1: SCHEDULE VIEW -->
      <div id="tabScheduleView" class="tab-view active">
        <!-- Smart Gantt Section -->
        <section class="flow-section">
          <div class="gantt-wrapper">
            <div class="gantt-time-scale" id="ganttTimeScale"></div>
            <div class="gantt-tracks-container" id="ganttTracks"></div>
          </div>
        </section>

        <!-- Workload Agenda Section -->
        <section class="agenda-section">
          <div class="agenda-title-header">
            <h2>Workload • Agenda</h2>
            <p class="agenda-subtitle" id="agendaTaskCount">Loading tasks...</p>
          </div>

          <div class="agenda-cards-grid" id="agendaTimeline">
            <!-- Dynamic Task Item Cards -->
          </div>
        </section>
      </div>

      <!-- TAB 2: COMPLETED & TIME LOG VIEW -->
      <div id="tabHistoryView" class="tab-view">
        <section class="history-section">
          <!-- Summary Metrics Cards -->
          <div class="metrics-summary-grid">
            <div class="metric-card">
              <div class="metric-label">Completed Tasks</div>
              <div class="metric-value" id="metricTotalCompleted">0</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Total Hours Logged</div>
              <div class="metric-value" id="metricTotalLogged">0h</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Estimated Hours</div>
              <div class="metric-value" id="metricTotalEstimated">0h</div>
            </div>
            <div class="metric-card">
              <div class="metric-label">Variance</div>
              <div class="metric-value" id="metricVariance">0h</div>
            </div>
          </div>

          <div class="agenda-title-header" style="margin-top: 24px;">
            <h2>Completed Tasks & Logged Hours</h2>
            <p class="agenda-subtitle">Adjust time spent to log accurate hours for history</p>
          </div>

          <!-- Completed Tasks List -->
          <div class="agenda-cards-grid" id="historyCardsGrid">
            <!-- Completed Task Cards -->
          </div>
        </section>
      </div>

      <!-- Floating Action Buttons -->
      <div class="bottom-action-bar">
        <button class="floating-action-btn primary" id="openAddTaskBtn">
          <span>+</span> Add Task
        </button>
        <button class="floating-action-btn secondary" id="reSolveBottomBtn">
          ⚡ Re-Solve
        </button>
      </div>

    </div>
  </div>

  <!-- Add Task Modal -->
  <div class="modal-overlay" id="addTaskModal">
    <div class="modal-container">
      <div class="modal-head">
        <h3>Add New Task</h3>
      </div>
      <div class="form-group">
        <label class="label-title">Task Title</label>
        <input type="text" class="custom-input" id="newTaskTitleInput" placeholder="e.g. Schedule passport appointment">
      </div>
      <div class="form-group">
        <label class="label-title">Notes / Directive (Optional)</label>
        <textarea class="custom-input custom-textarea" id="newTaskNotesInput" placeholder="Add extra context or urgency..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelAddTaskBtn">Cancel</button>
        <button class="btn-submit" id="saveAddTaskBtn">Create Task</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-container modal-lg">
      <div class="modal-head">
        <h3>Schedule Settings</h3>
      </div>
      <div class="form-group">
        <label class="label-title">Active Days</label>
        <div class="day-selector-grid" id="daySelectorGrid">
          <button class="day-chip" data-day="0">Mon</button>
          <button class="day-chip" data-day="1">Tue</button>
          <button class="day-chip" data-day="2">Wed</button>
          <button class="day-chip" data-day="3">Thu</button>
          <button class="day-chip" data-day="4">Fri</button>
          <button class="day-chip" data-day="5">Sat</button>
          <button class="day-chip" data-day="6">Sun</button>
        </div>
      </div>
      <div class="form-grid-2">
        <div class="form-group">
          <label class="label-title">Work Start Hour (24h)</label>
          <input type="number" class="custom-input" id="workStartHourInput" min="0" max="23">
        </div>
        <div class="form-group">
          <label class="label-title">Work End Hour (24h)</label>
          <input type="number" class="custom-input" id="workEndHourInput" min="0" max="24">
        </div>
      </div>
      <div class="form-grid-2">
        <div class="form-group">
          <label class="label-title">Buffer Minutes</label>
          <input type="number" class="custom-input" id="bufferMinutesInput" min="0" max="60">
        </div>
        <div class="form-group">
          <label class="label-title">Max Tasks / Day</label>
          <input type="number" class="custom-input" id="maxTasksPerDayInput" min="1" max="20">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelSettingsBtn">Cancel</button>
        <button class="btn-submit" id="saveSettingsBtn">Save Settings</button>
      </div>
    </div>
  </div>

  <!-- Completion Modal -->
  <div class="modal-overlay" id="completionModal">
    <div class="modal-container">
      <div class="modal-head">
        <h3>Complete Task</h3>
        <p class="agenda-subtitle" id="modalTaskTitle">Task Title</p>
      </div>
      <div class="form-group" style="margin-top: 16px;">
        <label class="label-title">Actual Time Spent (Minutes)</label>
        <input type="number" class="custom-input" id="actualMinutesInput" value="30">
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <button class="day-chip quick-chip" data-min="15">15m</button>
          <button class="day-chip quick-chip" data-min="30">30m</button>
          <button class="day-chip quick-chip" data-min="45">45m</button>
          <button class="day-chip quick-chip" data-min="60">60m</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelModalBtn">Cancel</button>
        <button class="btn-submit" id="confirmCompleteBtn">Mark Complete</button>
      </div>
    </div>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
